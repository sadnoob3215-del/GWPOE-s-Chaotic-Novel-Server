<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="GWPOE's Novel Server - 지포의 막장 소설 서버"
    >

    <meta name="theme-color" content="#0b0b0f">

    <title>GWPOE's Novel Server</title>

    <!-- Favicon -->
    <link
        rel="icon"
        type="image/svg+xml"
        href="assets/favicon/favicon.svg"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">

        <a href="index.html" class="logo">
            <img
                src="assets/logo/logo.svg"
                alt="Jipo's Novel Server"
            >
        </a>

        <nav class="navigation">
            <a href="#home">Home</a>
            <a href="#novels">Novels</a>
            <a href="#about">About</a>
        </nav>

    </header>


    <!-- MAIN -->
    <main>

        <!-- HERO -->
        <section class="hero" id="home">

            <div class="hero-content">

                <div class="hero-label">
                    GWPOE'S NOVEL SERVER
                </div>

                <h1>
                    막장 소설의<br>
                    <span>세계에 오신 것을 환영합니다.</span>
                </h1>

                <p>
                    평범한 이야기는 없습니다.
                </p>

                <a href="#novels" class="button">
                    소설 보기
                </a>

            </div>

        </section>


        <!-- NOVELS -->
        <section class="novels" id="novels">

            <div class="section-label">
                NOVELS
            </div>

            <h2>
                소설 목록
            </h2>

            <div class="novel-list">

                <article class="novel-card">

                    <h3>
                        Coming Soon
                    </h3>

                    <p>
                        새로운 막장 소설이 곧 공개됩니다.
                    </p>

                </article>

            </div>

        </section>


        <!-- ABOUT -->
        <section class="about" id="about">

            <div class="section-label">
                ABOUT
            </div>

            <h2>
                Jipo's Novel Server
            </h2>

            <p>
                지포의 막장 소설 서버입니다.
            </p>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <div>
            GWPOE's Novel Server
        </div>

        <div>
            © 2026 GWPOE's Novel Server.
        </div>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="js/main.js"></script>

</body>

</html>
